# Combine with docker-compose.yml; build each native image sequentially on small machines.
x-runtime: &runtime
  KAFKA_BOOTSTRAP_SERVERS: kafka:19092
  MB_LEDGER_JDBC_URL: jdbc:postgresql://postgres:5432/mb
  MB_LEDGER_USERNAME: ${MB_LEDGER_USERNAME:-mb}
  MB_LEDGER_PASSWORD: ${MB_LEDGER_PASSWORD:-mb}
services:
  gateway:
    image: mb-gateway:native
    build: {context: ., target: gateway}
    ports: ["8080:8080"]
    environment:
      <<: *runtime
      ENGINE_BOOK_URL: http://engine:8081
    depends_on:
      postgres: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
      engine: {condition: service_started}
  engine:
    image: mb-engine:native
    build: {context: ., target: engine}
    environment:
      <<: *runtime
      ENGINE_BOOK_HOST: 0.0.0.0
    depends_on:
      postgres: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
  settlements:
    image: mb-settlements:native
    build: {context: ., target: settlements}
    environment: *runtime
    depends_on:
      postgres: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
  snapshots:
    image: mb-snapshots:native
    build: {context: ., target: snapshots}
    profiles: [snapshots]
    environment: *runtime
    depends_on:
      postgres: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
